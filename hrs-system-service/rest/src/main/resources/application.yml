spring:
  application:
    name: hrs-system-service
  datasource:
    url: ${HRS_SYSTEM_DB_URL}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=5000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${HRS_SYSTEM_BIND_ADDRESS:127.0.0.1}
  port: ${HRS_SYSTEM_PORT:0}
  error:
    include-message: never
hermesx:
  system:
    admin-username: ${HRS_SYSTEM_ADMIN_USERNAME}
    admin-password: ${HRS_SYSTEM_ADMIN_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*Mapper.xml
