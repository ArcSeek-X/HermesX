# system 服务运行配置（UTF-8）
# 占位符写法：${环境变量:默认值}；没有冒号默认值的项目必须由运行环境提供。
# 配置包含服务发现、数据库连接、接口保护及序列化规则。

# 【应用名称】当前服务的名称，也是未单独指定注册名时在 Nacos 中使用的服务名。
# 这里的名称不是 Java 包名，也不是数据库名。
spring.application.name=hrs-system-service

# 【是否开启 Nacos 注册与发现】读取 HRS_SYSTEM_NACOS_ENABLED，未设置时默认 false。
# false：system 可以独立运行；true：启动时向配置的 Nacos 注册实例。
spring.cloud.nacos.discovery.enabled=${HRS_SYSTEM_NACOS_ENABLED:false}

# 【Nacos 地址】读取 HRS_NACOS_SERVER_ADDR，未设置时为空。
# 开启注册时必须提供可访问的 Nacos 地址，格式为主机:端口；这不是 system 的接口地址。
spring.cloud.nacos.discovery.server-addr=${HRS_NACOS_SERVER_ADDR:}

# 【Nacos 命名空间】读取 HRS_NACOS_NAMESPACE，未设置时为空；填写空间 ID，不是显示名称。
# 当前 Nacos 2.5.x 与客户端组合要求使用专用空间，开启注册时不能为空或 public。
# 命名空间用于隔离注册信息，不是业务中的 enterpriseId 或 organizationId。
spring.cloud.nacos.discovery.namespace=${HRS_NACOS_NAMESPACE:}

# 【Nacos 服务分组】读取 HRS_NACOS_GROUP，未设置时默认 DEFAULT_GROUP。
# 将来调用方发现此服务时，应使用相同的命名空间和分组。
spring.cloud.nacos.discovery.group=${HRS_NACOS_GROUP:DEFAULT_GROUP}

# 【Nacos 认证用户名】读取 HRS_NACOS_USERNAME，未设置时为空。
# 注册中心开启认证时按实际账号填写；与下面用户管理 API 的管理账号不是同一套身份。
spring.cloud.nacos.discovery.username=${HRS_NACOS_USERNAME:}

# 【Nacos 认证密码】读取 HRS_NACOS_PASSWORD，未设置时为空。
# 与 Nacos 账号配套使用；真实密码只从运行环境传入，不写入源码或提交 Git。
spring.cloud.nacos.discovery.password=${HRS_NACOS_PASSWORD:}

# 【登记给调用方的 system 实例 IP】读取 HRS_SYSTEM_REGISTER_IP，未设置时默认 127.0.0.1。
# 本机调用可用默认值；容器或其他电脑调用时，改为调用方能访问的地址，并同步调整监听地址。
# 这不是 Nacos 的 IP，也不能填写 0.0.0.0；实例端口由实际启动端口自动登记。
spring.cloud.nacos.discovery.ip=${HRS_SYSTEM_REGISTER_IP:127.0.0.1}

# 【system 独立数据库地址】必须提供 HRS_SYSTEM_DB_URL，没有默认值。
# SQLite JDBC 格式为 jdbc:sqlite:后接数据库文件路径；建议填写绝对路径，父目录须已存在。
# 当前规划使用 data/hrs_system.db，不要指向 Python 的 data/stock_analysis.db。
# Java 不会自动读取仓库根 .env，环境变量须传给实际启动的 Java 进程。
spring.datasource.url=${HRS_SYSTEM_DB_URL}

# 【数据库驱动类】SQLite JDBC 驱动的 Java 类名，由数据库依赖提供。
# 以后更换数据库时需同步调整驱动依赖、连接地址、建表及 SQL 方言，不能只改这一项。
spring.datasource.driver-class-name=org.sqlite.JDBC

# 【连接池最大连接数】本例最多保留 1 个数据库连接，减少 SQLite 并发写入争用。
# 多个请求需要排队取得连接；这不是 HTTP 线程数，也不代表服务只能接收一个请求。
spring.datasource.hikari.maximum-pool-size=1

# 【新连接初始化 SQL】每次建立物理连接时设置 SQLite 的 busy_timeout。
# 5000 的单位是毫秒：数据库被锁定时最多等待约 5 秒，不是 HTTP 请求超时或获取连接超时。
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout=5000

# 【禁止启动时建表或升级】never 表示 Spring 不执行初始化 SQL，Java 不负责数据库升级。
# 正式 SQL 只维护在服务 sql/hrs-system-service.sql，不打包到业务 JAR。
# 使用业务接口前须手动运行 scripts/db/manual_db_upgrade.py 准备匹配结构，不能以启动成功代替建库验收。
# 测试会单独显式开启初始化，只对测试自己创建的临时 SQLite 执行同一份正式 SQL。
spring.sql.init.mode=never

# 【拒绝未知 JSON 字段】true 表示请求体中出现 DTO 未定义的字段时返回参数错误。
# 例如不支持的 roleIds 不会被悄悄忽略，避免调用方误以为已保存。
spring.jackson.deserialization.fail-on-unknown-properties=true

# 【HTTP 监听地址】读取 HRS_SYSTEM_BIND_ADDRESS，未设置时默认 127.0.0.1，仅本机可访问。
# 需要跨机器访问时按实际网络配置；它控制服务监听，与上方登记到 Nacos 的实例 IP 职责不同。
server.address=${HRS_SYSTEM_BIND_ADDRESS:127.0.0.1}

# 【HTTP 监听端口】读取 HRS_SYSTEM_PORT，未设置时默认 0，由操作系统分配可用端口。
# 实际端口会显示在启动日志中；需要固定开发端口时通过环境变量指定。
server.port=${HRS_SYSTEM_PORT:0}

# 【默认错误响应中的异常消息】never 表示 Spring Boot 默认错误响应不携带异常 message。
# 用于减少内部信息泄露；业务自定义的 RestResult 提示仍由 GlobalExceptionHandler 决定。
server.error.include-message=never

# 【用户管理 API 管理账号】必须提供 HRS_SYSTEM_ADMIN_USERNAME，没有默认账号。
# 本案例用它进行 HTTP Basic 认证，独立于 hrs_system_user 表中被管理的用户，也不是 Nacos 账号。
hermesx.system.admin-username=${HRS_SYSTEM_ADMIN_USERNAME}

# 【用户管理 API 管理密码】必须提供 HRS_SYSTEM_ADMIN_PASSWORD，没有默认密码。
# 当前校验非空且 UTF-8 编码长度为 12 至 72 字节；真实值只从环境传入，不写入配置文件。
# 它用于保护管理接口，不是新增用户时写入数据库的用户密码。
hermesx.system.admin-password=${HRS_SYSTEM_ADMIN_PASSWORD}

# 【MyBatis SQL 映射文件位置】加载mapper目录中用户、部门、菜单的SQL映射。
# 各XML的namespace对应各自Mapper接口，SQL的id对应方法名，参数使用#{名称}绑定。
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
